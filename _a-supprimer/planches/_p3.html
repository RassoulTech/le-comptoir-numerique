://images.unsplash.com/photo-1645423555833-d2f4801dfc6a?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>prise-interrupteur #1</b><span>prise blanche mur vert</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1761479373576-ad4c1c5bb9af?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>prise-interrupteur #2</b><span>prise + interrupteur noirs</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1581967947421-a9812e72754c?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>prise-interrupteur #3</b><span>interrupteur blanc</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1738520420715-23a83fd078f7?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>prise-interrupteur #4</b><span>prise blanche mur bleu</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1774021798659-bf556d5fd833?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>prise-interrupteur #5</b><span>interrupteur mur blanc</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1556217994-22de7face210?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>prise-interrupteur #6</b><span>interrupteur blanc</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1788399629721-6f3688a50ba0?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>prise-interrupteur #7</b><span>prise tenue avec gant</span></figcaption></figure></div></section><section><h2>ECLAIRAGE-LED</h2><div class="g"><figure><img src="https://images.unsplash.com/photo-1789713340650-6f3b3cbe3ae7?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>eclairage-led #1</b><span>dalles LED plafond</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1674659719067-8735479ba10c?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>eclairage-led #2</b><span>ampoule LED sur table</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1531749086006-778f081e9fd8?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>eclairage-led #3</b><span>deux dalles rondes</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1714462187247-add7ed99e5d2?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>eclairage-led #4</b><span>plafond spots ronds</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1718221621618-e477ce33485a?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>eclairage-led #5</b><span>suspensions lumineuses</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1600867062551-60fca7e0b9c6?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>eclairage-led #6</b><span>ampoule allumee</span></figcaption></figure></div></section><section><h2>ENCEINTE-BLUETOOTH</h2><div class="g"><figure><img src="https://images.unsplash.com/photo-1582978571763-2d039e56f0c3?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>enceinte-bluetooth #1</b><span>enceinte blanche bois</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1547052178-7f2c5a20c332?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>enceinte-bluetooth #2</b><span>enceinte grise ovale</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1675319245480-215961c129f1?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>enceinte-bluetooth #3</b><span>enceinte blanche table noire</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1534949752991-a065b0f5dfaa?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>enceinte-bluetooth #4</b><span>enceinte noire</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1684326204478-e6165ce21b44?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>enceinte-bluetooth #5</b><span>objet metal fond blanc</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1628610780985-1bd6f186a702?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>enceinte-bluetooth #6</b><span>radio noire et grise</span></figcaption></figure></div></section><section><h2>MICROPHONE</h2><div class="g"><figure><img src="https://images.unsplash.com/photo-1590602846581-7d3eec520d07?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>microphone #1</b><span>micro noir fond blanc</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1708024528965-3c7813cbb777?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>microphone #2</b><span>micro fond noir</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1478737270239-2f02b77fc618?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>microphone #3</b><span>macro micro statique</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1581548708095-7158f2e63857?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>microphone #4</b><span>micro gris sur pied bois</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1613262155980-c9e47252316b?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>microphone #5</b><span>micro noir fond bleu</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1729111025722-350e6542f743?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>microphone #6</b><span>micro devant ecran</span></figcaption></figure></div></section><section><h2>RING-LIGHT</h2><div class="g"><figure><img src="https://images.unsplash.com/photo-1780413747936-1df5c1255d9f?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>ring-light #1</b><span>deux ring lights fenetre</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1780413747834-fdc0f2e4ef93?auto=format&fit=crop&w=400&q=70" alt=""><figcaption><b>ring-light #2</b><span>ring lights en magasin</span></figcaption></figure><figure><img src="https://images.unsplash.com/photo-1595406236320-a9aa2a54a00e?auto=for
